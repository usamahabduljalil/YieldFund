[package]
name = "yieldfund-vault"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Only the separate fault-injection Wasm used by the local Sandbox suite.
test-faults = []
# Separate standard-token/Rhea artifact; never use it to upgrade a simulator vault.
rhea = []

[dependencies]
near-sdk.workspace = true
yieldfund-accounting = { path = "../accounting" }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
