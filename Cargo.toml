[workspace]
members = ["contracts/accounting", "contracts/campaign-vault", "contracts/test-token", "contracts/strategy-simulator", "contracts/campaign-factory", "tests/integration"]
default-members = ["contracts/accounting", "contracts/campaign-vault", "contracts/test-token", "contracts/strategy-simulator"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.95"

[workspace.dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy"] }
near-contract-standards = "=5.30.0"

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

